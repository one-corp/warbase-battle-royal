<!DOCTYPE html>
<html>
<head>
    <title>Animation Test</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui">
        <h3>Animations</h3>
        <div id="animList"></div>
    </div>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 5, new BABYLON.Vector3(0, 1, 0), scene);
            camera.attachControl(canvas, true);
            
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 1.0;

            BABYLON.SceneLoader.ImportMeshAsync("", "./models/", "AnimatedSoldier.glb", scene).then((result) => {
                const animGroups = result.animationGroups;
                const list = document.getElementById("animList");
                
                animGroups.forEach((ag, idx) => {
                    const btn = document.createElement("button");
                    btn.innerText = ag.name;
                    btn.onclick = () => {
                        animGroups.forEach(a => a.stop());
                        ag.play(true);
                    };
                    list.appendChild(btn);
                    list.appendChild(document.createElement("br"));
                });
                
                // Play first by default
                if(animGroups.length > 0) animGroups[0].play(true);
            });

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(() => {
                scene.render();
            });
        });
    </script>
</body>
</html>
